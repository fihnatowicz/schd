<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#09060a">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ангелина">
<title>Ангелина · расписание</title>
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2309060a'/%3E%3Cpath d='M32 52 12 32a11 11 0 0 1 20-8 11 11 0 0 1 20 8Z' fill='%23ff2d95'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Rubik:wght@400;500;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#09060a; --card:#150b12; --card2:#1f1019;
  --line:#33192b; --line2:#4a2740;
  --text:#fbeaf3; --muted:#b08ca0; --dim:#75576a;
  --pink:#ff2d95; --pink2:#ff6fb7; --lilac:#c9a3ff; --peach:#ffb27a; --rose:#ffd6ea; --mint:#9df5d3;
  --r:20px;
  --hdr-h:196px;
  --display:"Unbounded","Rubik",system-ui,sans-serif;
  --sans:"Rubik",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --hand:"Caveat","Segoe Print","Bradley Hand",cursive;
}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--bg);color-scheme:dark;-webkit-text-size-adjust:100%}
body{margin:0;font:15px/1.4 var(--sans);color:var(--text);background:var(--bg);min-height:100dvh;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer}

/* ===== ambient: glow + floating emoji ===== */
.glow{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;
  background:
    radial-gradient(70% 45% at 50% -12%,rgba(255,45,149,.24),transparent 70%),
    radial-gradient(40% 30% at 95% 8%,rgba(201,163,255,.09),transparent 70%)}
.glow span{position:absolute;font-size:26px;opacity:.16;animation:floaty 11s ease-in-out infinite}
.glow span:nth-child(1){left:6%;top:22%}
.glow span:nth-child(2){left:84%;top:34%;animation-duration:13s;animation-delay:-4s;font-size:22px}
.glow span:nth-child(3){left:14%;top:58%;animation-duration:9s;animation-delay:-2s}
.glow span:nth-child(4){left:78%;top:72%;animation-duration:12s;animation-delay:-7s;font-size:30px}
.glow span:nth-child(5){left:48%;top:88%;animation-duration:10s;animation-delay:-5s}
.glow span:nth-child(6){left:90%;top:14%;animation-duration:14s;animation-delay:-9s;font-size:20px}

.wrap{max-width:560px;margin:0 auto;padding:0 14px}

/* ===== sticky header ===== */
.top{position:sticky;top:0;z-index:20;padding-top:env(safe-area-inset-top);
  background:rgba(9,6,10,.94);backdrop-filter:blur(18px) saturate(150%);-webkit-backdrop-filter:blur(18px) saturate(150%);
  border-bottom:2px dashed var(--line)}

.ribbon{overflow:hidden;background:linear-gradient(90deg,#ff2d95,#ff4fa8 50%,#ff2d95);color:#09060a;
  font:800 11px/1 var(--display);letter-spacing:.14em;text-transform:uppercase;padding:8px 0;
  box-shadow:0 6px 24px -10px rgba(255,45,149,.8)}
.track{display:flex;width:max-content;will-change:transform;animation:marquee 30s linear infinite}
.track span{white-space:nowrap;padding-right:2.2em}

.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0 6px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:40px;height:40px;flex:none;display:grid;place-items:center;font-size:20px;line-height:1;
  border-radius:14px 10px 15px 9px/10px 15px 9px 14px;transform:rotate(-8deg);
  background:linear-gradient(135deg,#2a1020,#170b13);border:2px solid rgba(255,45,149,.7);box-shadow:0 8px 22px -8px rgba(255,45,149,.9);
  animation:bob 3.6s ease-in-out infinite}
.brand b{display:block;font:700 27px/1 var(--hand);color:var(--rose);letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  text-shadow:0 0 18px rgba(255,45,149,.55)}
.brand small{display:block;color:var(--muted);font-size:11.5px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clock{flex:none;display:flex;align-items:baseline;font:800 19px/1 var(--display);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.clock .colon{animation:blink 1s steps(2) infinite;color:var(--pink);margin:0 1px}
.clock small{font-size:10px;color:var(--muted);margin-left:4px;font-weight:600}

.ticker{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:6px 8px;margin:0 0 8px;
  border:2px dashed var(--line2);border-radius:14px 18px 12px 20px/18px 12px 20px 14px;min-height:40px;
  background:linear-gradient(180deg,rgba(31,16,25,.95),rgba(21,11,18,.95));
  transition:border-color .3s,transform .2s}
.ticker:active{transform:scale(.99)}
.tk-state{display:inline-flex;align-items:center;gap:6px;flex:none;font:800 9px/1 var(--display);
  letter-spacing:.1em;text-transform:uppercase;padding:6px 8px;border-radius:999px}
.tk-state.hot{color:#09060a;background:var(--pink);box-shadow:0 0 14px rgba(255,45,149,.6)}
.tk-state.alt{color:#09060a;background:var(--lilac)}
.tk-state.mute{color:var(--muted);background:rgba(176,140,160,.14)}
.tk-subj{flex:1;min-width:0;font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tk-meta{flex:none;font:700 17px/1 var(--hand);color:var(--pink2);white-space:nowrap}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.hot .dot{animation:pulse 1.6s ease-out infinite}

.days{display:flex;gap:6px;padding:2px 0 10px;overflow-x:auto;scrollbar-width:none;scroll-snap-type:x proximity}
.days::-webkit-scrollbar{display:none}
.dchip{flex:0 0 calc((100% - 30px)/5.45);scroll-snap-align:start;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 4px 8px;
  border-radius:12px 9px 13px 8px/9px 13px 8px 12px;border:2px dashed transparent;color:var(--muted);font:500 11px/1 var(--sans);position:relative;
  transition:background .25s,color .25s,border-color .25s,transform .25s}
.dchip b{font:800 13px/1 var(--display);color:var(--text)}
.dchip.active{background:var(--card2);border-color:var(--line2);color:var(--text);transform:rotate(-2deg)}
.dchip.is-today b{color:var(--pink)}
.dchip.is-today::after{content:"💖";position:absolute;top:-7px;right:-4px;font-size:12px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.6))}
.wk-sep{flex:0 0 6px;align-self:stretch;margin:6px 4px;border-radius:2px;
  background:linear-gradient(180deg,transparent,rgba(255,45,149,.7),transparent)}
.scan{position:absolute;left:0;right:0;bottom:-2px;height:2px;pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(255,45,149,.95),transparent);
  background-size:50% 100%;background-repeat:no-repeat;animation:scan 3.8s linear infinite}

/* ===== list ===== */
main{position:relative;z-index:1;padding:8px 0 calc(90px + env(safe-area-inset-bottom))}
.day{margin-bottom:22px}
.day-head{position:sticky;top:var(--hdr-h);z-index:10;display:flex;align-items:center;gap:10px;margin:0;
  padding:12px 16px 10px;
  background:rgba(9,6,10,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.day-head .dn{font:800 12.5px/1.2 var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--text);padding:0 4px;
  background:linear-gradient(transparent 58%,rgba(255,45,149,.45) 58%,rgba(255,45,149,.45) 92%,transparent 92%)}
.day-head .dd{font:500 12px/1 var(--sans);color:var(--muted)}
.day-head .dc{margin-left:auto;font:600 16px/1 var(--hand);color:var(--dim)}
.day.today .day-head .dn{color:var(--pink);background:linear-gradient(transparent 58%,rgba(201,163,255,.45) 58%,rgba(201,163,255,.45) 92%,transparent 92%)}
.chip{font:800 8.5px/1 var(--display);letter-spacing:.1em;text-transform:uppercase;padding:5px 8px;border-radius:999px}
.today-chip{color:#09060a;background:var(--pink);transform:rotate(-3deg);box-shadow:0 0 12px rgba(255,45,149,.55)}

.week-sep{display:flex;align-items:center;gap:10px;margin:28px 16px 4px;color:var(--pink);
  font:700 21px/1 var(--hand);white-space:nowrap}
.week-sep i{font:800 10px/1 var(--display);font-style:normal;color:var(--muted);letter-spacing:.06em}
.week-sep::before,.week-sep::after{content:"";flex:1;height:0;border-top:2px dashed rgba(255,45,149,.45)}

/* --- ticket card --- */
.lesson{display:grid;grid-template-columns:66px 1fr;margin:0 14px 12px;padding:13px 13px 13px 12px;position:relative;overflow:hidden;
  --edge:rgba(255,111,183,.32);--rot:0deg;
  border:2px solid var(--edge);border-radius:var(--r);
  background:linear-gradient(180deg,var(--card2),var(--card));
  transform:rotate(var(--rot));
  animation:rise .55s cubic-bezier(.2,.7,.2,1) backwards;animation-delay:calc(var(--i,0)*45ms);
  transition:opacity .45s,border-color .45s,box-shadow .45s,background .45s,transform .3s}
.lesson>*{position:relative;z-index:1}
.lesson:nth-of-type(4n+1){--rot:-.6deg}
.lesson:nth-of-type(4n+2){--rot:.5deg}
.lesson:nth-of-type(4n+3){--rot:-.35deg}
.lesson:nth-of-type(4n+4){--rot:.7deg}
.lesson:active{transform:rotate(0deg) scale(.985)}
/* ticket notches */
.nt{position:absolute;left:78px;width:20px;height:20px;margin-left:-10px;border-radius:50%;background:var(--bg);box-shadow:0 0 0 2px var(--edge);z-index:2;transition:box-shadow .45s}
.nt-t{top:-10px}.nt-b{bottom:-10px}
.lesson.past{opacity:.4;filter:saturate(.55)}
.lesson.cond{border-style:dashed;opacity:.6}
.lesson.next{--edge:var(--lilac);opacity:1;border-style:dashed;box-shadow:0 14px 40px -22px rgba(201,163,255,.6)}
.lesson.live{--edge:var(--pink);--rot:0deg;opacity:1;border-color:transparent;background:transparent;
  box-shadow:0 22px 60px -22px rgba(255,45,149,.75);
  animation:rise .55s cubic-bezier(.2,.7,.2,1) backwards,breathe 3.2s ease-in-out 1s infinite}
.lesson.live::before{content:"";position:absolute;left:50%;top:50%;width:170%;aspect-ratio:1;z-index:0;
  transform:translate(-50%,-50%) rotate(0deg);
  background:conic-gradient(from 0deg,#ff2d95,#c9a3ff,#ffb27a,#fff0f7,#ff2d95);animation:spin 3.5s linear infinite}
.lesson.live::after{content:"";position:absolute;inset:2px;z-index:0;border-radius:calc(var(--r) - 2px);
  background:linear-gradient(180deg,#27111e,#190b14)}
/* emoji sticker */
.stk{position:absolute;top:-4px;right:8px;font-size:24px;line-height:1;transform:rotate(14deg);z-index:3;
  filter:drop-shadow(0 4px 6px rgba(0,0,0,.55));animation:wiggle 2.6s ease-in-out infinite}

.tcol{display:flex;flex-direction:column;gap:3px;padding:2px 10px 0 0;font-family:var(--display);font-variant-numeric:tabular-nums}
.ts{font-size:14.5px;font-weight:800;line-height:1.1;letter-spacing:-.02em;transition:color .45s}
.te{font-size:11px;font-weight:600;color:var(--muted);line-height:1.1;letter-spacing:-.01em}
.td{margin-top:7px;font:600 14px/1 var(--hand);color:var(--dim);white-space:nowrap}
.live .ts{color:var(--pink)}
.next .ts{color:var(--lilac)}

.body{min-width:0;display:flex;flex-direction:column;gap:6px;padding-left:12px;border-left:2px dashed rgba(255,214,234,.16)}
.live .body{border-left-color:rgba(255,111,183,.4)}
.head{display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-height:18px;padding-right:28px}
.kind{font:800 8.5px/1 var(--display);letter-spacing:.1em;padding:4px 7px;border-radius:999px;border:1.5px dashed currentColor}
.k-pr{color:var(--pink2)}
.k-ind{color:var(--lilac)}
.k-gr{color:var(--peach)}
.k-l{color:var(--mint)}
.badge{display:inline-flex;align-items:center;gap:5px;font:800 8.5px/1 var(--display);letter-spacing:.1em;text-transform:uppercase;
  padding:5px 8px;border-radius:999px;color:#09060a;transform:rotate(-2deg)}
.badge.live{background:var(--pink);box-shadow:0 0 14px rgba(255,45,149,.6)}
.badge.live .dot{animation:pulse 1.6s ease-out infinite}
.badge.live.brk{background:var(--peach);box-shadow:0 0 14px rgba(255,178,122,.45)}
.badge.live.brk .dot{animation:none}
.badge.next{background:var(--lilac)}
.subject{margin:0;font-size:15.5px;font-weight:700;line-height:1.28;letter-spacing:-.01em;overflow-wrap:anywhere}
.parts{display:flex;flex-direction:column;gap:6px}
.part{display:flex;align-items:center;gap:8px;min-width:0}
.part .idx{flex:none;width:17px;height:17px;border-radius:50%;background:rgba(255,255,255,.05);border:1.5px dashed var(--line2);
  color:var(--muted);font:800 8px/14px var(--display);text-align:center}
.part .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.psub{font-size:13px;font-weight:500;color:var(--text)}
.teacher{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.teacher small{color:var(--dim);font-size:11px}
.place{font-size:12px;color:var(--muted);line-height:1.35}
.room{flex:none;display:inline-flex;align-items:baseline;gap:4px;padding:3px 8px;border-radius:999px;
  background:rgba(255,255,255,.04);border:1.5px dashed var(--line2)}
.room small{font:500 9px/1 var(--sans);color:var(--dim)}
.room b{font:800 12px/1 var(--display);color:var(--text)}
.note{font:600 15px/1.25 var(--hand);color:var(--pink2)}
.prog{height:5px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:4px;border:1px dashed rgba(255,111,183,.25)}
.prog i{display:block;height:100%;width:0;border-radius:999px;
  background:repeating-linear-gradient(-45deg,var(--pink) 0 6px,var(--pink2) 6px 12px);box-shadow:0 0 10px rgba(255,45,149,.9);transition:width 1s linear}
.status{font:700 17px/1.15 var(--hand);color:var(--muted)}
.live .status{color:var(--pink)}
.live.brk .status{color:var(--peach)}
.next .status{color:var(--lilac)}

/* ===== fab ===== */
.fab{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));z-index:30;
  transform:translate(-50%,24px) rotate(-2deg);opacity:0;pointer-events:none;
  display:inline-flex;align-items:center;gap:8px;padding:12px 18px;border-radius:999px;
  border:2px dashed rgba(255,45,149,.75);background:rgba(255,45,149,.2);color:var(--pink);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  font:800 10px/1 var(--display);letter-spacing:.1em;text-transform:uppercase;
  box-shadow:0 12px 34px -12px rgba(255,45,149,.7);transition:opacity .3s,transform .3s}
.fab.alt{border-color:rgba(201,163,255,.75);background:rgba(201,163,255,.18);color:var(--lilac);box-shadow:0 12px 34px -12px rgba(201,163,255,.7)}
.fab.show{opacity:1;transform:translate(-50%,0) rotate(-2deg);pointer-events:auto}
.fab:active{transform:translate(-50%,0) rotate(0) scale(.97)}

@keyframes rise{from{opacity:0;transform:translateY(14px) rotate(var(--rot,0deg))}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(9,6,10,.5)}100%{box-shadow:0 0 0 7px rgba(9,6,10,0)}}
@keyframes blink{50%{opacity:.25}}
@keyframes scan{from{background-position:-100% 0}to{background-position:200% 0}}
@keyframes marquee{to{transform:translateX(-50%)}}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(1turn)}}
@keyframes breathe{50%{box-shadow:0 22px 70px -20px rgba(255,45,149,1)}}
@keyframes wiggle{0%,100%{transform:rotate(10deg)}50%{transform:rotate(20deg) translateY(-2px)}}
@keyframes bob{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(-2deg) translateY(-2px)}}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(-22px) rotate(10deg)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="glow" id="glow"></div>

<header class="top" id="top">
  <div class="ribbon" aria-hidden="true"><div class="track" id="ribbon"></div></div>
  <div class="wrap">
    <div class="bar">
      <div class="brand">
        <span class="logo" id="m-logo"></span>
        <div><b id="m-title"></b><small id="m-sub"></small></div>
      </div>
      <div class="clock" aria-live="off"><span id="ch">--</span><span class="colon">:</span><span id="cm">--</span><small id="cs">--</small></div>
    </div>
    <button class="ticker" id="ticker" type="button" aria-label="Перейти к текущему занятию"></button>
    <nav class="days" id="daynav" aria-label="Дни недели"></nav>
  </div>
  <div class="scan"></div>
</header>

<main id="list" class="wrap" style="padding-left:0;padding-right:0"></main>

<button class="fab" id="fab" type="button"><i class="dot"></i><span id="fab-txt">Сейчас</span></button>

/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const pad = n => String(n).padStart(2, '0');
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const toMin = t => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
const minToT = m => pad(Math.floor(m / 60)) + ':' + pad(m % 60);
const MONTHS = ['янв', 'фев', 'мар', 'апр', 'мая', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];
const DAY_ACC = { 1: 'в понедельник', 2: 'во вторник', 3: 'в среду', 4: 'в четверг', 5: 'в пятницу', 6: 'в субботу' };
const plural = (n, one, few, many) => { const a = n % 100, b = n % 10; if (a > 10 && a < 20) return many; if (b > 1 && b < 5) return few; if (b === 1) return one; return many; };
const fmtDur = mins => { mins = Math.max(0, Math.ceil(mins)); const h = Math.floor(mins / 60), m = mins % 60; return h ? (m ? `${h} ч ${m} мин` : `${h} ч`) : `${m} мин`; };
const fmtDurShort = mins => { const h = Math.floor(mins / 60), m = mins % 60; return h ? (m ? `${h}ч ${m}м` : `${h}ч`) : `${m}м`; };
const sameDay = (a, b) => a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
const fmtDate = d => `${d.getDate()} ${MONTHS[d.getMonth()]}`;
const fmtRange = (a, b) => a.getMonth() === b.getMonth() ? `${a.getDate()}–${b.getDate()} ${MONTHS[b.getMonth()]}` : `${fmtDate(a)} – ${fmtDate(b)}`;
const kindClass = c => c === 'ПР' ? 'k-pr' : c === 'ИНД' ? 'k-ind' : c === 'ГР' ? 'k-gr' : 'k-l';

/* week Mon..Sat containing `now`; Sunday rolls to the coming week */
function weekDates(now, weekOffset) {
  const d = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const dow = d.getDay();
  const mon = new Date(d);
  mon.setDate(d.getDate() - ((dow + 6) % 7) + (dow === 0 ? 7 : 0) + weekOffset * 7);
  const map = {};
  for (let i = 1; i <= 6; i++) { const x = new Date(mon); x.setDate(mon.getDate() + i - 1); map[i] = x; }
  return map;
}
const isSecondTuesday = d => d.getDay() === 2 && d.getDate() >= 8 && d.getDate() <= 14;

  for (let k = 0; k < 24; k++) {
    const m = new Date(from.getFullYear(), from.getMonth() + k, 1);
    const second = new Date(m.getFullYear(), m.getMonth(), 1 + ((2 - m.getDay() + 7) % 7) + 7);
    if (second >= from) return second;
  }
  return null;
}

/* ---------- flatten: two weeks, only days that have lessons ---------- */
const WEEKS = [0, 1];
const DAYS = DATA.days.filter(d => d.lessons.length);
const ITEMS = [];
WEEKS.forEach(week => DAYS.forEach(day => day.lessons.forEach((lesson, idx) => {
  ITEMS.push({
    id: `l-${week}-${day.dow}-${idx}`, week, day, lesson, idx,
    s: toMin(lesson.start), e: toMin(lesson.end),
    slots: lesson.slots.map(([a, b]) => [toMin(a), toMin(b)]),
    subject: [...new Set(lesson.parts.map(p => p.subject))].join(' / '),
  });
})));

/* ---------- time state ---------- */
function compute(now) {
  const dates = WEEKS.map(w => weekDates(now, w));
  const todayDow = now.getDay();
  const nowMin = now.getHours() * 60 + now.getMinutes() + now.getSeconds() / 60;
  let live = null, next = null;
  ITEMS.forEach(it => {
    it.date = dates[it.week][it.day.dow];
    it.enabled = it.lesson.cond === 'second-tuesday' ? isSecondTuesday(it.date) : true;
    let st = 'future';
    if (it.week === 0 && todayDow !== 0) {
      if (it.day.dow < todayDow) st = 'past';
      else if (it.day.dow === todayDow) { if (nowMin >= it.e) st = 'past'; else if (nowMin >= it.s) st = 'live'; }
    }
    if (!it.enabled && st === 'live') st = 'future';
    it.status = st; it.isNext = false; it.onBreak = false; it.resumeAt = null;
    it.progress = st === 'live' ? (nowMin - it.s) / (it.e - it.s) : 0;
    if (st === 'live' && !it.slots.some(([a, b]) => nowMin >= a && nowMin < b)) {
      it.onBreak = true;
      const nx = it.slots.find(([a]) => a > nowMin);
      it.resumeAt = nx ? nx[0] : null;
    }
    if (it.enabled) {
      if (st === 'live' && !live) live = it;
      if (st === 'future' && !next) next = it;
    }
  });
  if (next) next.isNext = true;
  return { now, dates, todayDow, nowMin, live, next, target: live || next };
}

/* ---------- render ---------- */
function cardEl(it) {
  const L = it.lesson;
  const subjects = [...new Set(L.parts.map(p => p.subject))];
  const kind = (L.parts.find(p => p.kind) || {}).kind;
  const multi = L.parts.length > 1;
  const parts = L.parts.map((p, i) => `
    <div class="part">
      ${multi ? `<span class="idx">${i + 1}</span>` : ''}
      <div class="info">
        ${subjects.length > 1 ? `<span class="psub">${esc(p.subject)}</span>` : ''}
        ${p.teacher ? `<span class="teacher">${esc(p.teacher)}${p.role ? ` <small>${esc(p.role)}</small>` : ''}</span>` : ''}
        ${p.room && p.room.place ? `<span class="place">${esc(p.room.place)}</span>` : ''}
      </div>
      ${p.room && p.room.room ? `<span class="room"><small>к.${p.room.building}</small><b>${esc(p.room.room)}</b></span>` : ''}
    </div>`).join('');
  const el = document.createElement('article');
  el.className = 'lesson';
  el.id = it.id;
  el.style.setProperty('--i', it.idx);
  el.innerHTML = `
    <i class="nt nt-t"></i><i class="nt nt-b"></i><span class="stk" hidden></span>
    <div class="tcol"><span class="ts">${L.start}</span><span class="te">${L.end}</span><span class="td">${fmtDurShort(it.e - it.s)}</span></div>
    <div class="body">
      <div class="head"><span class="badge" hidden></span>${kind ? `<span class="kind ${kindClass(kind.code)}" title="${esc(kind.label)}">${esc(kind.code)}</span>` : ''}</div>
      <h3 class="subject">${esc(subjects.join(' / '))}</h3>
      <div class="parts">${parts}</div>
      <div class="note" ${L.note ? '' : 'hidden'}>${esc(L.note || '')}</div>
      <div class="prog" hidden><i></i></div>
      <div class="status" hidden></div>
    </div>`;
  it.el = el;
  it.refs = { badge: $('.badge', el), stk: $('.stk', el), note: $('.note', el), prog: $('.prog', el), bar: $('.prog i', el), status: $('.status', el) };
  return el;
}

function render(st) {
  const frag = document.createDocumentFragment();
  WEEKS.forEach(week => {
    const dates = st.dates[week];
    if (week > 0) {
      const sep = document.createElement('div');
      sep.className = 'week-sep';
      sep.innerHTML = `<span>следующая неделя ✨</span><i>${fmtRange(dates[DAYS[0].dow], dates[DAYS[DAYS.length - 1].dow])}</i>`;
      frag.appendChild(sep);
    }
    DAYS.forEach(day => {
      const date = dates[day.dow];
      const isToday = sameDay(date, st.now);
      const n = day.lessons.length;
      const sec = document.createElement('section');
      sec.className = 'day' + (isToday ? ' today' : '');
      sec.id = `day-${week}-${day.dow}`;
      sec.dataset.key = `${week}-${day.dow}`;
      sec.innerHTML = `<h2 class="day-head">
        <span class="dn">${day.name}</span><span class="dd">${fmtDate(date)}</span>
        ${isToday ? '<span class="chip today-chip">сегодня</span>' : ''}
        <span class="dc">${n} ${plural(n, 'занятие', 'занятия', 'занятий')}</span></h2>`;
      ITEMS.filter(it => it.week === week && it.day === day).forEach(it => sec.appendChild(cardEl(it)));
      frag.appendChild(sec);
    });
  });
  $('#list').replaceChildren(frag);

  $('#daynav').innerHTML = WEEKS.map(week => DAYS.map(d => {
    const dt = st.dates[week][d.dow];
    return `<button type="button" class="dchip${sameDay(dt, st.now) ? ' is-today' : ''}" data-key="${week}-${d.dow}"><span>${d.short}</span><b>${pad(dt.getDate())}</b></button>`;
  }).join('')).join('<span class="wk-sep"></span>');
  $$('.dchip').forEach(b => b.addEventListener('click', () => scrollToDay(b.dataset.key)));
}

function whenText(it, st) {
  if (sameDay(it.date, st.now)) return `начнётся в ${it.lesson.start} · через ${fmtDur(it.s - st.nowMin)}`;
  const tomorrow = new Date(st.now); tomorrow.setDate(tomorrow.getDate() + 1);
  if (sameDay(it.date, tomorrow)) return `завтра в ${it.lesson.start}`;
  return `${DAY_ACC[it.day.dow]}, ${fmtDate(it.date)} в ${it.lesson.start}`;
}

function patch(it, st) {
  const { el, refs } = it;
  el.classList.toggle('past', it.status === 'past');
  el.classList.toggle('live', it.status === 'live');
  el.classList.toggle('next', it.isNext);
  el.classList.toggle('cond', !it.enabled);
  el.classList.toggle('brk', it.status === 'live' && it.onBreak);

  let sticker = '';
  if (it.status === 'live') {
    refs.badge.hidden = false; refs.badge.className = 'badge live' + (it.onBreak ? ' brk' : '');
    refs.badge.innerHTML = `<i class="dot"></i>${it.onBreak ? 'перерыв' : 'сейчас'}`;
    sticker = it.onBreak ? '☕' : '💅';
  } else if (it.isNext) {
    refs.badge.hidden = false; refs.badge.className = 'badge next'; refs.badge.textContent = 'далее';
    sticker = '✨';
  } else refs.badge.hidden = true;
  refs.stk.hidden = !sticker;
  if (sticker && refs.stk.textContent !== sticker) refs.stk.textContent = sticker;

  refs.prog.hidden = it.status !== 'live';
  if (it.status === 'live') refs.bar.style.width = (Math.min(1, it.progress) * 100).toFixed(2) + '%';

  let txt = '';
  if (it.status === 'live') {
    txt = it.onBreak && it.resumeAt != null
      ? `перерыв · продолжение в ${minToT(it.resumeAt)}`
      : `идёт · до ${it.lesson.end} · осталось ${fmtDur(it.e - st.nowMin)}`;
  } else if (it.isNext) txt = whenText(it, st);
  refs.status.hidden = !txt; refs.status.textContent = txt;

  if (it.lesson.cond === 'second-tuesday') {
    const nx = it.enabled ? null : nextSecondTuesday(it.date);
    refs.note.textContent = it.enabled
      ? 'проводится на этой неделе · 2-й вторник месяца'
      : `только во 2-й вторник месяца${nx ? ` · ближайший — ${fmtDate(nx)}` : ''}`;
  }
}

function renderTicker(st) {
  const L = st.live, N = st.next;
  let cls, state, subj, meta;
  if (L) {
    cls = L.onBreak ? 'alt' : 'hot'; state = L.onBreak ? 'перерыв' : 'сейчас'; subj = L.subject;
    meta = L.onBreak && L.resumeAt != null ? `до ${minToT(L.resumeAt)}` : `ещё ${fmtDur(L.e - st.nowMin)}`;
  } else if (N) {
    cls = 'alt'; state = 'далее'; subj = N.subject;
    meta = sameDay(N.date, st.now) ? `через ${fmtDur(N.s - st.nowMin)}` : `${N.day.short} ${fmtDate(N.date)}, ${N.lesson.start}`;
  } else { cls = 'mute'; state = '—'; subj = 'Занятий нет'; meta = ''; }
  $('#ticker').innerHTML = `<span class="tk-state ${cls}"><i class="dot"></i>${state}</span><span class="tk-subj">${esc(subj)}</span><span class="tk-meta">${esc(meta)}</span>`;
  $('#fab').classList.toggle('alt', !L);
  $('#fab-txt').textContent = L ? 'Сейчас' : 'Далее';
}

}

/* ---------- scrolling ---------- */
function scrollToItem(it) {
  if (!it || !it.el) return;
  if (it.idx === 0) return scrollToDay(`${it.week}-${it.day.dow}`);   /* first lesson: show the whole day from its header */
  const r = it.el.getBoundingClientRect();
  const hdr = headerH();
  const avail = innerHeight - hdr;
  const top = scrollY + r.top - hdr - Math.max(52, (avail - r.height) / 2);
  scrollTo({ top: Math.max(0, top), behavior: reduced ? 'auto' : 'smooth' });
}
function scrollToDay(key) {
  const sec = $(`#day-${key}`);
  if (!sec) return;
  const prev = sec.previousElementSibling;
  const anchor = prev && prev.classList.contains('week-sep') ? prev : sec;   /* keep the week divider visible */
  scrollTo({ top: Math.max(0, scrollY + anchor.getBoundingClientRect().top - headerH() - (anchor === sec ? -1 : 10)), behavior: reduced ? 'auto' : 'smooth' });
}
let spyRaf = 0, activeKey = null;
function spy() {
  spyRaf = 0;
  const hdr = headerH();
  const limit = hdr + Math.max(44, (innerHeight - hdr) * 0.25);
  let cur = null;
  $$('.day').forEach(sec => { if (sec.getBoundingClientRect().top <= limit) cur = sec; });
  const key = cur ? cur.dataset.key : ($('.day') || {}).dataset?.key;
  if (key === activeKey) return;
  activeKey = key;
  const nav = $('#daynav');
  $$('.dchip').forEach(b => {
    const on = b.dataset.key === key;
    b.classList.toggle('active', on);
    if (on) nav.scrollTo({ left: b.offsetLeft - (nav.clientWidth - b.offsetWidth) / 2, behavior: reduced ? 'auto' : 'smooth' });
  });
}
addEventListener('scroll', () => { if (!spyRaf) spyRaf = requestAnimationFrame(spy); }, { passive: true });

let io = null;
function watchTarget(it) {
  if (io) io.disconnect();
  const fab = $('#fab');
  if (!it) { fab.classList.remove('show'); return; }
  io = new IntersectionObserver(([en]) => fab.classList.toggle('show', !en.isIntersecting),
    { rootMargin: `-${headerH()}px 0px 0px 0px`, threshold: 0.15 });
  io.observe(it.el);
}

/* ---------- loop ---------- */
let state = null, renderedKey = null, targetId = null;
function tick() {
  const now = new Date();
  $('#ch').textContent = pad(now.getHours());
  $('#cm').textContent = pad(now.getMinutes());
  $('#cs').textContent = pad(now.getSeconds());
  const st = compute(now);
  const key = st.dates[0][1].toDateString() + '|' + now.toDateString();
  if (key !== renderedKey) { renderedKey = key; activeKey = null; render(st); }
  ITEMS.forEach(it => patch(it, st));
  renderTicker(st);
  const tid = st.target ? st.target.id : null;
  if (tid !== targetId) { targetId = tid; watchTarget(st.target); }
  state = st;
  return st;
}

new ResizeObserver(() => document.documentElement.style.setProperty('--hdr-h', headerH() + 'px')).observe($('#top'));
$('#ticker').addEventListener('click', () => scrollToItem(state && state.target));
$('#fab').addEventListener('click', () => scrollToItem(state && state.target));
document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });

renderStatic();
tick();
spy();
setInterval(tick, 1000);
setTimeout(() => scrollToItem(state && state.target), 320);
})();
</script>
</body>
</html>
